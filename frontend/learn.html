<head>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f7f3;
            color: #123c32;
        }

        header {
            background: #176b4b;

            padding: 22px 6%;
            display: flex;
            justify-content: space-between;

            flex-wrap: wrap;
            gap: 12px;
        }

        header h2 { margin: 0; }

            color: white;
            text-decoration: none;
        }

        select, button {
            padding: 11px 15px;
            border-radius: 9px;
            border: none;
            cursor: pointer;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .intro, .lesson {
            background: white;
            padding: 24px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        .lesson h2 { color: #176b4b; }

        .lesson p {
            line-height: 1.7;
            color: #52665e;

            background: #176b4b;
            color: white;
            margin-top: 10px;
        }

        .lesson .complete {
            background: #e6f4eb;
            color: #176b4b;
            margin-left: 8px;
        }

        .lesson-content {
            display: none;
            background: #f5faf6;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .lesson-content.show { display: block; }

        .progress {
            height: 12px;
            background: #dce9df;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #26945e;
            transition: width .3s;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #71847b;
        }

        @media(max-width: 600px) {
            header { padding: 18px; }
            .lesson, .intro { padding: 18px; }

</head>

const translations = {
    en: {
        header: "Learn",
        title: "Financial Learning 💚",
        subtitle: "Learn simple money management skills and build a better financial future.",
        progress: "Your Learning Progress",
        completed: "lessons completed",
        back: "← Dashboard",
        read: "Read Lesson",
        hide: "Hide Lesson",
        mark: "✓ Mark Completed",
        done: "✓ Completed",
        footer: "© 2026 ArthaMitra | Your Financial Friend 💚"
    },
    kn: {
        header: "ಕಲಿಯಿರಿ",
        title: "ಹಣಕಾಸಿನ ಕಲಿಕೆ 💚",
        subtitle: "ಸರಳ ಹಣ ನಿರ್ವಹಣಾ ಕೌಶಲ್ಯಗಳನ್ನು ಕಲಿಯಿರಿ ಮತ್ತು ಉತ್ತಮ ಹಣಕಾಸಿನ ಭವಿಷ್ಯವನ್ನು ನಿರ್ಮಿಸಿ.",
        progress: "ನಿಮ್ಮ ಕಲಿಕೆಯ ಪ್ರಗತಿ",
        completed: "ಪಾಠಗಳು ಪೂರ್ಣಗೊಂಡಿವೆ",
        back: "← ಡ್ಯಾಶ್‌ಬೋರ್ಡ್",
        read: "ಪಾಠ ಓದಿ",
        hide: "ಪಾಠ ಮರೆಮಾಡಿ",
        mark: "✓ ಪೂರ್ಣಗೊಂಡಿದೆ ಎಂದು ಗುರುತಿಸಿ",
        done: "✓ ಪೂರ್ಣಗೊಂಡಿದೆ",
        footer: "© 2026 ಅರ್ಥಮಿತ್ರ | ನಿಮ್ಮ ಹಣಕಾಸಿನ ಸ್ನೇಹಿತ 💚"
    }
};

let completed = JSON.parse(
    localStorage.getItem("arthaLessonsCompleted") || "[]"
);

const container = document.getElementById("lessonsContainer");
const languageSelect = document.getElementById("language");

function renderPage() {
    const lang = languageSelect.value;
    const words = translations[lang];

    document.documentElement.lang = lang;

    document.getElementById("headerTitle").textContent = words.header;
    document.getElementById("pageTitle").textContent = words.title;
    document.getElementById("subtitle").textContent = words.subtitle;
    document.getElementById("progressTitle").textContent = words.progress;
    document.getElementById("back").textContent = words.back;
    document.getElementById("footer").textContent = words.footer;

    container.replaceChildren();

    lessons.forEach((lesson, index) => {
        const card = document.createElement("section");
        card.className = "lesson";

        const heading = document.createElement("h2");
        heading.textContent = lesson.icon + " " + lesson.title[lang];

        const description = document.createElement("p");
        description.textContent = lesson.description[lang];

        const content = document.createElement("div");
        content.className = "lesson-content";
        content.id = "lessonContent" + index;

        const list = document.createElement("ul");

        lesson.content[lang].forEach(point => {
            const item = document.createElement("li");
            item.textContent = point;
            item.style.marginBottom = "12px";
            item.style.lineHeight = "1.6";
            list.appendChild(item);
        });

        content.appendChild(list);

        const readButton = document.createElement("button");
        readButton.textContent = words.read;

        readButton.addEventListener("click", () => {
            const isOpen = content.classList.toggle("show");
            readButton.textContent = isOpen ? words.hide : words.read;
        });

        const completeButton = document.createElement("button");
        completeButton.className = "complete";

        function updateCompleteButton() {
            completeButton.textContent = completed.includes(index)
                ? words.done
                : words.mark;
        }

        updateCompleteButton();

        completeButton.addEventListener("click", () => {
            if (completed.includes(index)) {
                completed = completed.filter(item => item !== index);
            } else {
                completed.push(index);
            }

            localStorage.setItem(
                "arthaLessonsCompleted",
                JSON.stringify(completed)
            );

            updateCompleteButton();
            updateProgress();
        });

        card.append(heading, description, readButton, completeButton, content);
        container.appendChild(card);
    });

    updateProgress();
}

function updateProgress() {
    const lang = languageSelect.value;
    const count = completed.length;

    document.getElementById("progressFill").style.width =
        (count / lessons.length * 100) + "%";

    document.getElementById("progressText").textContent =
        count + " / " + lessons.length + " " +
        translations[lang].completed;
}

languageSelect.addEventListener("change", () => {
    localStorage.setItem("lang", languageSelect.value);
    renderPage();
});

languageSelect.value = localStorage.getItem("lang") || "en";
renderPage();
</script>
