
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c32">
  <title>ArthaMitra - Your Financial Friend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h2>🌱 ArthaMitra</h2>
  <div>
    <button type="button" onclick="setLang('en')">English</button>
    <button type="button" onclick="setLang('kn')">ಕನ್ನಡ</button>
  </div>
</header>

<main class="auth-container">

  <section class="welcome">
    <h1 data-i18n="welcome">Your Money, Your Future.</h1>
    <p data-i18n="subtitle">Learn, save and grow with ArthaMitra.</p>

    <div class="features">
      <p data-i18n="feature1">💰 Track your income and expenses</p>
      <p data-i18n="feature2">🎯 Plan your savings goals</p>
      <p data-i18n="feature3">🏛️ Discover government schemes</p>
      <p data-i18n="feature4">🔔 Stay updated with reminders</p>
    </div>
  </section>

  <section class="auth-card">

    <div class="tabs">
      <button id="loginTab" class="active" type="button"
        onclick="showAuth('login')" data-i18n="login">Login</button>

      <button id="registerTab" type="button"
        onclick="showAuth('register')" data-i18n="register">Register</button>
    </div>

    <form id="loginForm">

      <h2 data-i18n="welcomeBack">Welcome Back!</h2>

      <label data-i18n="mobile">Mobile Number</label>
      <input id="loginPhone" type="tel" maxlength="10"
        required placeholder="10-digit mobile number"
        data-i18n-placeholder="mobilePlaceholder">

      <label data-i18n="pin">4-digit PIN</label>
      <input id="loginPin" type="password" maxlength="4"
        inputmode="numeric" required placeholder="Enter PIN"
        data-i18n-placeholder="pinPlaceholder">

      <button class="primary-btn" type="submit"
        data-i18n="login">Login</button>

    </form>

    <form id="registerForm" hidden>

      <h2 data-i18n="createAccount">Create Account</h2>

      <label data-i18n="fullName">Full Name</label>
      <input id="regName" required placeholder="Your name"
        data-i18n-placeholder="namePlaceholder">

      <label data-i18n="mobile">Mobile Number</label>
      <input id="regPhone" type="tel" maxlength="10"
        required placeholder="10-digit mobile number"
        data-i18n-placeholder="mobilePlaceholder">

      <label data-i18n="createPin">Create 4-digit PIN</label>
      <input id="regPin" type="password" maxlength="4"
        inputmode="numeric" required placeholder="Create PIN"
        data-i18n-placeholder="createPinPlaceholder">

      <label data-i18n="language">Language</label>
      <select id="regLanguage">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
      </select>

      <label data-i18n="age">Age</label>
      <input id="regAge" type="number" min="18" max="120"
        required placeholder="Your age"
        data-i18n-placeholder="agePlaceholder">

      <label data-i18n="gender">Gender</label>
      <select id="regGender" required>
        <option value="" data-i18n-option="select">Select</option>
        <option value="female" data-i18n-option="female">Female</option>
        <option value="male" data-i18n-option="male">Male</option>
        <option value="other" data-i18n-option="other">Other</option>
        <option value="prefer_not_to_say" data-i18n-option="preferNot">Prefer not to say</option>
      </select>

      <label data-i18n="bank">Do you have a bank account?</label>
      <select id="regBank">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label data-i18n="insurance">Do you have insurance?</label>
      <select id="regInsurance">
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <button class="primary-btn" type="submit"
        data-i18n="createAccount">Create Account</button>

    </form>

    <p id="message" role="status"></p>

  </section>

</main>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
