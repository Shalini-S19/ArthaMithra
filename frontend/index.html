
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123c32">
  <title>ArthaMitra - Your Financial Friend</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h2>🌱 <span data-i18n="app.name">ArthaMitra</span></h2>
  <div>
    <button type="button" onclick="setLang('en')">English</button>
    <button type="button" onclick="setLang('kn')">ಕನ್ನಡ</button>
  </div>
</header>

<main class="auth-container">

  <section class="welcome">
    <h1 data-i18n="app.tagline">Your Money, Your Financial Friend.</h1>
    <p data-i18n="welcome.subtitle">Learn, save and grow with ArthaMitra.</p>

    <div class="features">
      <p data-i18n="welcome.feature1">💰 Track your income and expenses</p>
      <p data-i18n="welcome.feature2">🎯 Plan your savings goals</p>
      <p data-i18n="welcome.feature3">🏛️ Discover government schemes</p>
      <p data-i18n="welcome.feature4">🔔 Stay updated with reminders</p>
    </div>
  </section>

  <section class="auth-card">

    <div class="tabs">
      <button id="loginTab" class="active" type="button"
        onclick="showAuth('login')" data-i18n="login.tab">Login</button>

      <button id="registerTab" type="button"
        onclick="showAuth('register')" data-i18n="register.tab">Register</button>
    </div>

    <form id="loginForm">

      <h2 data-i18n="login.title">Welcome Back!</h2>

      <label data-i18n="login.phone">Mobile Number</label>
      <input id="loginPhone" type="tel" maxlength="10"
        required placeholder="10-digit mobile number"
        data-i18n-placeholder="login.phone_placeholder">

      <label data-i18n="login.pin">4-digit PIN</label>
      <input id="loginPin" type="password" maxlength="4"
        inputmode="numeric" required placeholder="Enter PIN"
        data-i18n-placeholder="login.pin_placeholder">

      <button class="primary-btn" type="submit"
        data-i18n="login.login_btn">Login</button>

    </form>

    <form id="registerForm" hidden>

      <h2 data-i18n="register.title">Create Account</h2>

      <label data-i18n="register.name">Full Name</label>
      <input id="regName" required placeholder="Your name"
        data-i18n-placeholder="register.name_placeholder">

      <label data-i18n="register.phone">Mobile Number</label>
      <input id="regPhone" type="tel" maxlength="10"
        required placeholder="10-digit mobile number"
        data-i18n-placeholder="register.phone_placeholder">

      <label data-i18n="register.pin">Create 4-digit PIN</label>
      <input id="regPin" type="password" maxlength="4"
        inputmode="numeric" required placeholder="Create PIN"
        data-i18n-placeholder="register.pin_placeholder">

      <label data-i18n="common.language">Language</label>
      <select id="regLanguage" onchange="setLang(this.value)">
        <option value="en">English</option>
        <option value="kn">ಕನ್ನಡ</option>
      </select>

      <label data-i18n="register.age">Age</label>
      <input id="regAge" type="number" min="18" max="120"
        required placeholder="Your age"
        data-i18n-placeholder="register.age_placeholder">

      <label data-i18n="register.gender">Gender</label>
      <select id="regGender" required>
        <option value="" data-i18n-option="register.select">Select</option>
        <option value="female" data-i18n-option="register.female">Female</option>
        <option value="male" data-i18n-option="register.male">Male</option>
        <option value="other" data-i18n-option="register.other">Other</option>
        <option value="prefer_not_to_say" data-i18n-option="register.prefer_not">Prefer not to say</option>
      </select>

      <label data-i18n="register.bank">Do you have a bank account?</label>
      <select id="regBank">
        <option value="yes" data-i18n-option="register.yes">Yes</option>
        <option value="no" data-i18n-option="register.no">No</option>
      </select>

      <label data-i18n="register.insurance">Do you have insurance?</label>
      <select id="regInsurance">
        <option value="yes" data-i18n-option="register.yes">Yes</option>
        <option value="no" data-i18n-option="register.no">No</option>
      </select>

      <button class="primary-btn" type="submit"
        data-i18n="register.submit">Create Account</button>

    </form>

    <p id="message" role="status"></p>

  </section>

</main>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
