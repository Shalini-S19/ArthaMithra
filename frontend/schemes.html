
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b4b">
    <title>Government Schemes | ArthaMitra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f7f3;
            color: #123c32;
        }

        header {
            background: #176b4b;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 23px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .intro, .scheme-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.04);
        }

        .intro h2 {
            margin-top: 0;
        }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        select, button {
            padding: 12px 16px;
            border-radius: 9px;
            border: 1px solid #cfe3d7;
            font-size: 15px;
        }

        button {
            background: #176b4b;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background: #789b89;
            cursor: default;
        }

        .scheme-card h2 {
            margin-top: 0;
            color: #176b4b;
        }

        .category {
            display: inline-block;
            background: #e6f4eb;
            color: #176b4b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .detail {
            margin: 17px 0;
            line-height: 1.6;
        }

        .detail h3 {
            margin-bottom: 5px;
            font-size: 16px;
        }

        .detail p {
            margin-top: 5px;
            color: #52665e;
        }

        .documents {
            padding-left: 22px;
            line-height: 1.7;
            color: #52665e;
        }

        .source-link {
            display: inline-block;
            margin: 12px 12px 0 0;
            color: #176b4b;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            margin-top: 12px;
            color: #176b4b;
        }

        .error {
            color: #b42318;
            padding: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #71847b;
        }

        @media(max-width: 600px) {
            header {
                padding: 18px;
            }

            .scheme-card, .intro {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏛️ ArthaMitra – Government Schemes</h1>
    <a href="dashboard.html">← Back to Dashboard</a>
</header>

<main class="container">

    <section class="intro">
        <h2>Discover Government Schemes 💚</h2>
        <p>
            Explore government schemes, understand their benefits,
            check eligibility and find official application information.
        </p>

        <div class="controls">
            <select id="language">
                <option value="en">English</option>
                <option value="kn">ಕನ್ನಡ</option>
            </select>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="insurance">Insurance</option>
                <option value="pension">Pension</option>
                <option value="health">Health</option>
            </select>
        </div>
    </section>

    <div id="schemesContainer">
        Loading government schemes...
    </div>

</main>

<footer>
    © 2026 ArthaMitra | Your Financial Friend 💚
</footer>

<script src="js/api.js"></script>

<script>
let allSchemes = [];

const container = document.getElementById("schemesContainer");
const languageSelect = document.getElementById("language");
const categoryFilter = document.getElementById("categoryFilter");

function getText(value, language) {
    if (!value) return "Information not available.";
    if (typeof value === "string") return value;
    return value[language] || value.en || "Information not available.";
}

function safeUrl(url) {
    try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" ? parsed.href : "#";
    } catch {
        return "#";
    }
}

function renderSchemes() {
    const language = languageSelect.value;
    const category = categoryFilter.value;

    const filtered = allSchemes.filter(scheme =>
        category === "all" || scheme.category === category
    );

    container.replaceChildren();

    if (filtered.length === 0) {
        container.textContent = "No schemes found in this category.";
        return;
    }

    filtered.forEach(scheme => {
        const card = document.createElement("section");
        card.className = "scheme-card";

        const name = document.createElement("h2");
        name.textContent = getText(scheme.name, language);

        const categoryLabel = document.createElement("span");
        categoryLabel.className = "category";
        categoryLabel.textContent = getText(scheme.category_label, language);

        card.append(name, categoryLabel);

        const verified = document.createElement("p");
        verified.className = "status";
        verified.textContent = scheme.verified
            ? "✓ Source marked as verified"
            : "⚠️ Source verification pending";
        card.appendChild(verified);

        function addDetail(title, value) {
            const section = document.createElement("div");
            section.className = "detail";

            const heading = document.createElement("h3");
            heading.textContent = title;

            const paragraph = document.createElement("p");
            paragraph.textContent = getText(value, language);

            section.append(heading, paragraph);
            card.appendChild(section);
        }

        addDetail("🎁 Benefits", scheme.benefit);
        addDetail("👥 Eligibility", scheme.eligibility_text);
        addDetail("📝 How to Apply", scheme.how_to_apply);

        const documentsHeading = document.createElement("h3");
        documentsHeading.textContent = "📄 Required Documents";
        card.appendChild(documentsHeading);

        const documentsList = document.createElement("ul");
        documentsList.className = "documents";

        (scheme.documents || []).forEach(documentItem => {
            const li = document.createElement("li");
            li.textContent = getText(documentItem, language);
            documentsList.appendChild(li);
        });

        card.appendChild(documentsList);

        const source = document.createElement("a");
        source.className = "source-link";
        source.href = safeUrl(scheme.source_url);
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = "View Official Source ↗";
        card.appendChild(source);

        const applyButton = document.createElement("button");
        applyButton.textContent = "Mark as Applied";

        const statusMessage = document.createElement("p");
        statusMessage.className = "status";

        applyButton.addEventListener("click", async () => {
            applyButton.disabled = true;
            applyButton.textContent = "Saving...";

            try {
                await api(
                    "POST",
                    "/api/schemes/" + encodeURIComponent(scheme.id) + "/applied"
                );

                applyButton.textContent = "✓ Applied";
                statusMessage.textContent = "Your application status has been saved.";
            } catch (error) {
                applyButton.disabled = false;
                applyButton.textContent = "Mark as Applied";
                statusMessage.textContent =
                    error.message || "Unable to save application status.";
            }
        });

        card.append(applyButton, statusMessage);
        container.appendChild(card);
    });
}

async function loadSchemes() {
    try {
        const response = await api("GET", "/api/schemes");

        allSchemes = Array.isArray(response)
            ? response
            : (response.schemes || []);

        renderSchemes();

    } catch (error) {
        console.error("Schemes loading error:", error);
        container.textContent =
            "Unable to load government schemes. Please refresh the page.";
        container.className = "error";
    }
}

languageSelect.addEventListener("change", renderSchemes);
categoryFilter.addEventListener("change", renderSchemes);

loadSchemes();
</script>

</body>
</html>
