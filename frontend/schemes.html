
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b4b">
    <title>Government Schemes | ArthaMitra</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f7f3;
            color: #123c32;
        }

        header {
            background: #176b4b;
            color: white;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 { margin: 0; font-size: 23px; }

        header a {
            color: white;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .language-select, select, button {
            padding: 12px 16px;
            border-radius: 9px;
            border: 1px solid #cfe3d7;
            font-size: 15px;
        }

        .language-select {
            background: white;
            color: #176b4b;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 18px;
        }

        .intro, .scheme-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 22px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.04);
        }

        .intro h2 { margin-top: 0; }

        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            background: #176b4b;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:disabled {
            background: #789b89;
            cursor: default;
        }

        .scheme-card h2 {
            margin-top: 0;
            color: #176b4b;
        }

        .category {
            display: inline-block;
            background: #e6f4eb;
            color: #176b4b;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .detail {
            margin: 17px 0;
            line-height: 1.6;
        }

        .detail h3 {
            margin-bottom: 5px;
            font-size: 16px;
        }

        .detail p {
            margin-top: 5px;
            color: #52665e;
        }

        .documents {
            padding-left: 22px;
            line-height: 1.7;
            color: #52665e;
        }

        .source-link {
            display: inline-block;
            margin: 12px 12px 0 0;
            color: #176b4b;
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            margin-top: 12px;
            color: #176b4b;
        }

        .error {
            color: #b42318;
            padding: 15px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #71847b;
        }

        @media(max-width: 600px) {
            header { padding: 18px; }
            .scheme-card, .intro { padding: 18px; }
        }
    </style>
</head>

<body>

<header>
    <h1>🏛️ ArthaMitra – <span data-i18n="schemesPage.header">Government Schemes</span></h1>

    <div class="header-actions">
        <select class="language-select"
                data-language-selector
                aria-label="Select language"
                onchange="setLang(this.value)">
            <option value="en">English</option>
            <option value="kn">ಕನ್ನಡ</option>
        </select>

        <a href="dashboard.html" data-i18n="schemesPage.back">
            ← Back to Dashboard
        </a>
    </div>
</header>

<main class="container">

    <section class="intro">
        <h2 data-i18n="schemesPage.title">Discover Government Schemes 💚</h2>

        <p data-i18n="schemesPage.subtitle">
            Explore government schemes, understand their benefits,
            check eligibility and find official application information.
        </p>

        <div class="controls">
            <select id="categoryFilter">
                <option value="all" data-i18n-option="schemesPage.all">All Categories</option>
                <option value="insurance" data-i18n-option="schemesPage.insurance">Insurance</option>
                <option value="pension" data-i18n-option="schemesPage.pension">Pension</option>
                <option value="health" data-i18n-option="schemesPage.health">Health</option>
            </select>
        </div>
    </section>

    <div id="schemesContainer" data-i18n="schemesPage.loading">
        Loading government schemes...
    </div>

</main>

<footer data-i18n="schemesPage.footer">
    © 2026 ArthaMitra | Your Financial Friend 💚
</footer>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>

<script>
let allSchemes = [];

const container = document.getElementById("schemesContainer");
const categoryFilter = document.getElementById("categoryFilter");

function schemeText(value, language) {
    if (!value) {
        return language === "kn"
            ? "ಮಾಹಿತಿ ಲಭ್ಯವಿಲ್ಲ."
            : "Information not available.";
    }

    if (typeof value === "string") return value;

    return value[language] || value.en || "Information not available.";
}

function schemeLabel(key) {
    return typeof t === "function" ? t(key) : key;
}

function safeUrl(url) {
    try {
        const parsed = new URL(url);

        return parsed.protocol === "https:"
            ? parsed.href
            : "#";
    } catch {
        return "#";
    }
}

function renderSchemes() {
    const language = getCurrentLanguage();
    const category = categoryFilter.value;

    const filtered = allSchemes.filter(scheme =>
        category === "all" || scheme.category === category
    );

    container.replaceChildren();
    container.className = "";

    if (filtered.length === 0) {
        container.textContent = schemeLabel("schemes.none");
        return;
    }

    filtered.forEach(scheme => {
        const card = document.createElement("section");
        card.className = "scheme-card";

        const name = document.createElement("h2");
        name.textContent = schemeText(scheme.name, language);

        const categoryLabel = document.createElement("span");
        categoryLabel.className = "category";

        const categoryKeys = {
            insurance: "schemesPage.insurance",
            pension: "schemesPage.pension",
            health: "schemesPage.health"
        };

        categoryLabel.textContent = schemeLabel(
            categoryKeys[scheme.category] || "schemesPage.other"
        );

        card.append(name, categoryLabel);

        const verified = document.createElement("p");
        verified.className = "status";
        verified.textContent = scheme.verified
            ? schemeLabel("schemesPage.verified")
            : schemeLabel("schemesPage.unverified");

        card.appendChild(verified);

        function addDetail(title, value) {
            const section = document.createElement("div");
            section.className = "detail";

            const heading = document.createElement("h3");
            heading.textContent = title;

            const paragraph = document.createElement("p");
            paragraph.textContent = schemeText(value, language);

            section.append(heading, paragraph);
            card.appendChild(section);
        }

        addDetail(
            "🎁 " + schemeLabel("schemesPage.benefits"),
            scheme.benefit
        );

        addDetail(
            "👥 " + schemeLabel("schemesPage.eligibility"),
            scheme.eligibility_text
        );

        if (scheme.why) {
            addDetail(
                "💡 " + schemeLabel("schemesPage.why"),
                scheme.why
            );
        }

        addDetail(
            "📝 " + schemeLabel("schemes.how_to_apply"),
            scheme.how_to_apply
        );

        const documentsHeading = document.createElement("h3");
        documentsHeading.textContent =
            "📄 " + schemeLabel("schemes.documents");

        card.appendChild(documentsHeading);

        const documentsList = document.createElement("ul");
        documentsList.className = "documents";

        (scheme.documents || []).forEach(item => {
            const li = document.createElement("li");
            li.textContent = schemeText(item, language);
            documentsList.appendChild(li);
        });

        card.appendChild(documentsList);

        const source = document.createElement("a");
        source.className = "source-link";
        source.href = safeUrl(scheme.source_url);
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = schemeLabel("schemesPage.official_source") + " ↗";

        card.appendChild(source);

        const applyButton = document.createElement("button");
        applyButton.textContent = schemeLabel("scheme_extra.mark_applied");

        const statusMessage = document.createElement("p");
        statusMessage.className = "status";

        applyButton.addEventListener("click", async () => {
            applyButton.disabled = true;
            applyButton.textContent = schemeLabel("schemesPage.saving");

            try {
                await api(
                    "POST",
                    "/api/schemes/" + encodeURIComponent(scheme.id) + "/applied"
                );

                applyButton.textContent = schemeLabel("scheme_extra.applied");
                statusMessage.textContent =
                    schemeLabel("schemesPage.applied_success");

            } catch (error) {
                console.error(error);

                applyButton.disabled = false;
                applyButton.textContent =
                    schemeLabel("scheme_extra.mark_applied");

                statusMessage.textContent =
                    error.message || schemeLabel("schemesPage.applied_error");
            }
        });

        card.append(applyButton, statusMessage);
        container.appendChild(card);
    });
}

async function loadSchemes() {
    try {
        const response = await api("GET", "/api/schemes");

        allSchemes = Array.isArray(response)
            ? response
            : (response.schemes || []);

        renderSchemes();

    } catch (error) {
        console.error("Schemes loading error:", error);

        container.className = "error";
        container.textContent = schemeLabel("schemesPage.load_error");
    }
}

categoryFilter.addEventListener("change", renderSchemes);

document.addEventListener("languageChanged", renderSchemes);

loadSchemes();
</script>

</body>
</html>
